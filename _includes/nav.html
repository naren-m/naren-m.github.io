<div>
    <a class="internal-link" href="{{ site.baseurl }}/"><b>{{ site.title }}</b></a>
</div>
<button id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
    <span class="theme-icon-light" aria-hidden="true">🌙</span>
    <span class="theme-icon-dark" aria-hidden="true">☀️</span>
</button>
<script>
  (function() {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    btn.addEventListener('click', function() {
      var current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
      btn.setAttribute('aria-pressed', next === 'dark' ? 'true' : 'false');
    });
    btn.setAttribute('aria-pressed', document.documentElement.getAttribute('data-theme') === 'dark' ? 'true' : 'false');
  })();
</script>
