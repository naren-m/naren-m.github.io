<style>
  #search-container {
    margin: 2em 0;
    padding: 1.5em;
    background: #f5f7ff;
    border-radius: 4px;
  }

  #search-input {
    width: 100%;
    padding: 0.8em;
    font-size: 16px;
    border: 2px solid #ddd;
    border-radius: 4px;
    box-sizing: border-box;
  }

  #search-input:focus {
    outline: none;
    border-color: #8b88e6;
  }

  #search-results {
    margin-top: 1em;
    max-height: 400px;
    overflow-y: auto;
  }

  .search-result-item {
    padding: 1em;
    margin: 0.5em 0;
    background: white;
    border-radius: 4px;
    border-left: 3px solid #8b88e6;
  }

  .search-result-item h4 {
    margin: 0 0 0.5em 0;
  }

  .search-result-item p {
    margin: 0;
    color: #666;
    font-size: 0.9em;
  }

  .no-results {
    padding: 1em;
    text-align: center;
    color: #666;
  }
</style>

<div id="search-container">
  <input
    type="text"
    id="search-input"
    placeholder="Search notes... (e.g., 'quantum', 'cryptography', 'sanskrit')"
    autocomplete="off"
  />
  <div id="search-results"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
<script>
  (function() {
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');

    // Build search index from all notes
    const notes = [
      {% for note in site.notes %}
      {
        title: {{ note.title | jsonify }},
        url: "{{ site.baseurl }}{{ note.url }}",
        content: {{ note.content | strip_html | normalize_whitespace | jsonify }},
        excerpt: {{ note.excerpt | strip_html | truncatewords: 30 | jsonify }}
      },
      {% endfor %}
    ];

    // Initialize Fuse.js with fuzzy search options
    const fuseOptions = {
      keys: [
        { name: 'title', weight: 0.7 },      // Title matches weighted higher
        { name: 'content', weight: 0.3 }     // Content matches weighted lower
      ],
      threshold: 0.4,           // 0.0 = perfect match, 1.0 = match anything
      distance: 100,            // How far to search in text
      minMatchCharLength: 2,    // Minimum characters to match
      ignoreLocation: true,     // Search entire content, not just beginning
      includeScore: true,       // Include match score in results
      useExtendedSearch: false
    };

    const fuse = new Fuse(notes, fuseOptions);

    function search(query) {
      if (!query || query.length < 2) {
        searchResults.innerHTML = '';
        return;
      }

      // Perform fuzzy search
      const results = fuse.search(query).slice(0, 10); // Limit to 10 results

      displayResults(results, query);
    }

    function displayResults(results, query) {
      if (results.length === 0) {
        searchResults.innerHTML = '<div class="no-results">No notes found matching "' + query + '"</div>';
        return;
      }

      const html = results.map(result => {
        const note = result.item;
        const score = Math.round((1 - result.score) * 100); // Convert to percentage
        const excerpt = note.excerpt || note.content.substring(0, 150) + '...';

        return `
          <div class="search-result-item">
            <h4>
              <a href="${note.url}">${note.title}</a>
              <span style="font-size: 0.7em; color: #999; font-weight: normal; margin-left: 0.5em;">${score}%</span>
            </h4>
            <p>${excerpt}</p>
          </div>
        `;
      }).join('');

      searchResults.innerHTML = html;
    }

    // Debounce search to avoid too many updates
    let searchTimeout;
    searchInput.addEventListener('input', function(e) {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        search(e.target.value);
      }, 300);
    });

    // Clear results when input is cleared
    searchInput.addEventListener('keyup', function(e) {
      if (e.target.value === '') {
        searchResults.innerHTML = '';
      }
    });
  })();
</script>
