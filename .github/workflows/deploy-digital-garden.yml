name: Deploy Digital Garden

on:
  push:
    branches: ["master", "migration/digital-garden"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive  # Critical: fetch literature-notes

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: |
          gem install bundler
          bundle install

      - name: Copy literature-notes to _notes
        run: |
          # Remove symlinks and copy actual content from submodule
          rm -f _notes/CSE _notes/Security _notes/Statistics _notes/books _notes/highlights _notes/india _notes/math _notes/people _notes/sanskrit-lit
          cp -r literature-notes/CSE _notes/
          cp -r literature-notes/Security _notes/
          cp -r literature-notes/Statistics _notes/
          cp -r literature-notes/books _notes/
          cp -r literature-notes/highlights _notes/
          cp -r literature-notes/india _notes/
          cp -r literature-notes/math _notes/
          cp -r literature-notes/people _notes/
          cp -r literature-notes/sanskrit-lit _notes/

      - name: Build Jekyll site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
