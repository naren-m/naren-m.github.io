name: Deploy Digital Garden

on:
  push:
    branches: ["master", "migration/digital-garden"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive  # Critical: fetch literature-notes

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: |
          gem install bundler
          bundle install

      - name: Copy literature-notes to _notes
        run: |
          # Remove symlinks and copy actual content from submodule (reorganized structure)
          rm -f _notes/computer-science _notes/sanskrit-literature _notes/history _notes/mathematics _notes/media _notes/people _notes/music _notes/pages _notes/finances
          cp -r literature-notes/content/domains/computer-science _notes/
          cp -r literature-notes/content/domains/humanities/sanskrit-literature _notes/
          cp -r literature-notes/content/domains/humanities/history _notes/
          cp -r literature-notes/content/domains/mathematics _notes/
          cp -r literature-notes/content/media _notes/
          cp -r literature-notes/content/people _notes/
          cp -r literature-notes/music _notes/
          cp -r literature-notes/pages _notes/
          cp -r literature-notes/finances _notes/

          # Copy assets for images to be accessible
          # Note pages use permalink: /:slug/ so ../assets/ resolves to /assets/ at root
          mkdir -p assets
          cp -r literature-notes/assets/* assets/ 2>/dev/null || true

          # Copy embedded assets from media content (videos have nested assets)
          if [ -d "literature-notes/content/media/videos/assets" ]; then
            mkdir -p _notes/media/videos/assets
            cp -r literature-notes/content/media/videos/assets/* _notes/media/videos/assets/
          fi

          # Copy wellness/ayurveda images
          if [ -d "literature-notes/content/domains/wellness" ]; then
            cp -r literature-notes/content/domains/wellness _notes/
          fi

      - name: Build Jekyll site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
